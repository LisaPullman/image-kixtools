# Cloudflare Pages configuration
# https://developers.cloudflare.com/pages/functions/wrangler-configuration/
#
# NOTE: Pages does NOT support [build] section (that's for Workers).
# The build command is configured in the Cloudflare dashboard:
#   Framework preset = Vite
#   Build command    = npm run build
#   Output directory = dist

name = "kix-image-tools"
pages_build_output_dir = "./dist"
compatibility_date = "2025-01-01"
compatibility_flags = ["nodejs_compat"]

# Environment variables available to Pages Functions at runtime.
# NOTE: do NOT set NODE_ENV=production here — CF Pages already sets it
# for production builds, AND having it set during `npm ci` causes npm to
# skip devDependencies (vite, wrangler, etc.) and the build fails.
[vars]
PUBLIC_SITE_ORIGIN = "https://image.kixtools.com"

# ---------------------------------------------------------------
# Production environment overrides
# ---------------------------------------------------------------
[env.production]
name = "kix-image-tools-production"

[env.production.vars]
PUBLIC_SITE_ORIGIN = "https://image.kixtools.com"

# ---------------------------------------------------------------
# Preview environment (used for PR previews)
# ---------------------------------------------------------------
[env.preview]
name = "kix-image-tools-preview"

[env.preview.vars]
PUBLIC_SITE_ORIGIN = "https://preview.image.kixtools.com"