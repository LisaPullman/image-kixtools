<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 56" fill="none">
  <defs>
    <linearGradient id="logoBg" x1="0" y1="0" x2="56" y2="56" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0F172A"/>
      <stop offset="1" stop-color="#1E293B"/>
    </linearGradient>
    <linearGradient id="logoEar" x1="28" y1="6" x2="28" y2="50" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FB923C"/>
      <stop offset="1" stop-color="#F97316"/>
    </linearGradient>
    <linearGradient id="logoFace" x1="28" y1="20" x2="28" y2="52" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FBBF24"/>
      <stop offset="1" stop-color="#F97316"/>
    </linearGradient>
    <linearGradient id="logoText" x1="68" y1="20" x2="200" y2="40" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0F172A"/>
      <stop offset="1" stop-color="#334155"/>
    </linearGradient>
  </defs>
  <!-- Logo mark on the left -->
  <g>
    <rect width="56" height="56" rx="14" fill="url(#logoBg)"/>
    <path d="M16 12 L21 28 L12 24 Z" fill="url(#logoEar)"/>
    <path d="M40 12 L35 28 L44 24 Z" fill="url(#logoEar)"/>
    <path d="M28 18 L42 26 L28 48 L14 26 Z" fill="url(#logoFace)"/>
    <path d="M17 26 L28 19 L21 33 Z" fill="#FED7AA" opacity="0.9"/>
    <path d="M39 26 L28 19 L35 33 Z" fill="#FED7AA" opacity="0.9"/>
    <path d="M28 30 L35 36 L28 46 L21 36 Z" fill="#FFFFFF" opacity="0.95"/>
    <circle cx="21.5" cy="28" r="2.1" fill="#0F172A"/>
    <circle cx="34.5" cy="28" r="2.1" fill="#0F172A"/>
    <circle cx="22.1" cy="27.4" r="0.6" fill="#FFFFFF"/>
    <circle cx="35.1" cy="27.4" r="0.6" fill="#FFFFFF"/>
    <path d="M28 36 L30.2 38 L28 40 L25.8 38 Z" fill="#0F172A"/>
  </g>
  <!-- Wordmark on the right -->
  <g transform="translate(70, 0)">
    <!-- "fox" in bold, "ai" in lighter weight -->
    <text x="0" y="38" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="800" font-size="32" fill="url(#logoText)" letter-spacing="-1">fox<tspan font-weight="400" fill="#F97316">ai</tspan></text>
    <text x="0" y="52" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="500" font-size="9" fill="#64748B" letter-spacing="2">INTELLIGENT TOOLS</text>
  </g>
