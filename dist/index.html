    <script>
      // Hide boot splash as soon as React paints
      (function () {
        function hideBoot() {
          var el = document.getElementById('foxai-boot');
          if (el) {
            el.classList.add('hidden');
            setTimeout(function () { el.parentNode && el.parentNode.removeChild(el); }, 400);
          }
        }
        // Try a few times: after DOMContentLoaded, after window load, and after a short delay
        document.addEventListener('DOMContentLoaded', function () {
          setTimeout(hideBoot, 300);
        });
        window.addEventListener('load', function () {
          setTimeout(hideBoot, 600);
        });
        // Final fallback
        setTimeout(hideBoot, 2500);
      })();
    </script>
